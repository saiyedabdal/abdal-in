<section class="um um--face">
  <div class="um__wrap">
    <p class="um__kicker">The shelf</p>
    <h1 class="um__title">Books</h1>
    <p class="um__lede">The books that rewired how I read a problem &mdash; a shelf I&rsquo;m
       still filling, one read at a time. Pull one off to see why.</p>
  </div>

  <div class="face" data-face aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <circle class="face__head" cx="100" cy="100" r="92"/>
      <g class="face__eye">
        <ellipse class="face__white" cx="70" cy="86" rx="18" ry="21"/>
        <circle class="face__pupil" cx="70" cy="86" r="8" data-cx="70" data-cy="86"/>
      </g>
      <g class="face__eye">
        <ellipse class="face__white" cx="130" cy="86" rx="18" ry="21"/>
        <circle class="face__pupil" cx="130" cy="86" r="8" data-cx="130" data-cy="86"/>
      </g>
      <path class="face__mouth" d="M70 126 Q100 148 130 126"/>
    </svg>
  </div>
</section>

<section class="us us--dark">
  <div class="us__in">
    <!-- category filter (JS-gated; styled like the Studio's) -->
    <div class="bfilter" aria-label="Filter books by category">
      <button class="bfilter__btn is-on" type="button" data-cat="all" aria-pressed="true">All</button>
      <button class="bfilter__btn" type="button" data-cat="operations" aria-pressed="false">Operations</button>
      <button class="bfilter__btn" type="button" data-cat="leadership" aria-pressed="false">Leadership</button>
      <button class="bfilter__btn" type="button" data-cat="strategy" aria-pressed="false">Strategy</button>
      <button class="bfilter__btn" type="button" data-cat="scaling" aria-pressed="false">Scaling</button>
    </div>

    <ul class="shelf">
      <li class="book" data-cat="operations" style="--c:#15406a;--h:240px"
          data-title="The Goal" data-author="Eliyahu M. Goldratt &amp; Jeff Cox"
          data-cat-label="Operations" data-cover="/assets/img/books/the-goal.webp"
          data-rating="" data-note="">
        <button class="book__spine" type="button" aria-label="Open: The Goal">The Goal</button>
      </li>
      <li class="book" data-cat="leadership" style="--c:#12639e;--h:250px"
          data-title="Amp It Up" data-author="Frank Slootman"
          data-cat-label="Leadership" data-cover="/assets/img/books/amp-it-up.webp"
          data-rating="" data-note="">
        <button class="book__spine" type="button" aria-label="Open: Amp It Up">Amp It Up</button>
      </li>
      <li class="book" data-cat="strategy" style="--c:#7a1f1f;--h:226px"
          data-title="Only the Paranoid Survive" data-author="Andrew S. Grove"
          data-cat-label="Strategy" data-cover="/assets/img/books/paranoid.webp"
          data-rating="" data-note="">
        <button class="book__spine" type="button" aria-label="Open: Only the Paranoid Survive">Only the Paranoid Survive</button>
      </li>
      <li class="book" data-cat="scaling" style="--c:#b0261d;--h:234px"
          data-title="Blitzscaling" data-author="Reid Hoffman &amp; Chris Yeh"
          data-cat-label="Scaling" data-cover="/assets/img/books/blitzscaling.webp"
          data-rating="" data-note="">
        <button class="book__spine" type="button" aria-label="Open: Blitzscaling">Blitzscaling</button>
      </li>
    </ul>
    <p class="shelf__hint" hidden>Tap a spine to pull it off the shelf.</p>

    <!-- the pulled-out book (populated on click) -->
    <div class="bdetail" aria-live="polite">
      <div class="bdetail__cover"><img alt="" decoding="async"></div>
      <div class="bdetail__meta">
        <h3 class="bdetail__title"></h3>
        <p class="bdetail__author"></p>
        <span class="bdetail__cat"></span>
        <p class="bdetail__stars"></p>
        <p class="bdetail__note"></p>
        <button class="bdetail__close" type="button">&larr; Back to the shelf</button>
      </div>
    </div>
  </div>
</section>

<div class="uback">
  <a href="/">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    Back to abdal.in
  </a>
</div>
